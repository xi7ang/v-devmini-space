</head>
<body>
<header class="qy-header">
  <div class="container-x header-inner">
    <div class="qy-logo">
      <a href="index.html" style="display:flex;align-items:center;gap:10px">
        <span class="logo-mark">▶</span><span class="logo-text">V<b>影视</b></span>

    </div>
    <nav class="qy-nav" id="qyNav"></nav>
    <div class="qy-search">
      <form class="search-box" id="searchForm" autocomplete="off">
        <span class="search-type" id="searchType">全部 ▾</span>

      </form>

<main class="container-x qy-main">
  <section id="homeView">
    <div class="hero" id="hero"></div>
    <div class="quickbar" id="quickbar"></div>
    <div id="sections"></div>
  </section>

  <section id="listView" hidden>

      <select id="sortSelect" aria-label="排序">
        <option value="new">最新发布</option>
        <option value="title">按标题</option>
        <option value="type">按类型</option>
      </select>
      <span class="stat" id="stat"></span>
    </div>
    <ul class="qy-mod-ul" id="listGrid"></ul>
    <div class="qy-empty" id="listEmpty" hidden><div class="big">🍿</div><p>没有匹配的资源</p><p style="color:var(--muted)">换个关键词，或切换分类试试。</p></div>
    <div class="load-more-wrap"><button class="btn btn-ghost" id="loadMore" hidden>加载更多</button></div>
  </section>

  <div class="qy-loading" id="loading">资源加载中…</div>
