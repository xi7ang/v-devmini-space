<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div class="bg-wall" aria-hidden="true">
  <div class="bg-wall__stage"><div class="bg-wall__track" id="wallTrack"></div></div>
  <div class="bg-wall__fade"></div>
</div>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="brand">
      <span class="brand__logo">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
          <rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand__name">V<span class="brand__accent">影视</span></span>
    </a>
    <nav class="site-nav" id="siteNav"></nav>
    <form class="search-mini" id="searchForm" autocomplete="off">
      <input type="text" id="searchInput" placeholder="搜索影视资源 ..." aria-label="搜索" name="keyword" />
      <button type="submit" aria-label="搜索">🔍</button>
    </form>
    <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
  </div>
</header>

<main class="container">
  <section id="homeView">
    <div class="hero" id="hero"></div>
    <div class="filters" id="quickbar"></div>
    <div id="sections"></div>
  </section>

  <section id="listView" hidden>
    <div class="section-title" id="listTitle">全部资源</div>
    <div class="filters">
      <div id="catChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <span class="divv"></span>
      <div id="platChips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <select class="input" id="sortSelect" aria-label="排序">
        <option value="new">最新发布</option>
        <option value="title">按标题</option>
        <option value="type">按类型</option>
      </select>
      <span class="stat" id="stat"></span>
    </div>
    <div class="grid-cards" id="listGrid"></div>
    <div class="empty" id="listEmpty" hidden><div class="big">🍿</div><p>没有匹配的资源</p><p style="color:var(--text-low)">换个关键词，或切换分类试试。</p></div>
    <div class="load-more-wrap"><button class="btn" id="loadMore" hidden>加载更多</button></div>
  </section>

  <div class="loading" id="loading">LOADING …</div>

  </div>
</footer>

<script src="assets/js/common.js"></script>
<script src="assets/js/app.js"></script>

</html>
